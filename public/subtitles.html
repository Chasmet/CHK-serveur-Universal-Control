<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHK Sous-titres</title><style>body{margin:auto;max-width:920px;padding:16px;background:#10171c;color:#f4f7f7;font:16px system-ui}h1{color:#58e4b0;font-size:24px}button,input,textarea,select{font:inherit;color:inherit;background:#243b39;border:1px solid #5b7775;border-radius:8px;padding:8px;margin:4px}textarea{width:95%;box-sizing:border-box}audio{width:100%}article{border:1px solid #34454e;border-radius:10px;padding:10px;margin:8px 0}label{display:block}#active{font-size:22px;color:#58e4b0;min-height:2em}#transport{position:sticky;top:0;background:#10171c;padding:8px 0}small{color:#b1c5c2}</style></head><body><h1>CHK SOUS-TITRES</h1><p id="status">Connexion au projet…</p><section id="upload"><label>Choisir ton morceau original <input id="media" type="file" accept="audio/*,video/*,.wav,.flac"></label><button id="send">Importer</button><progress id="progress" max="100" value="0"></progress></section><div id="transport"><audio id="audio" controls preload="metadata"></audio><div id="active"></div><button id="back">− 1 s</button><button id="forward">+ 1 s</button><button id="add">Ajouter à la lecture</button><button id="save">Enregistrer corrections</button><button id="refresh">Actualiser</button></div><p><small>Horaires en millisecondes. Les mots non réalignés ne reçoivent pas d'horodatages fictifs. Les changements restent dans le brouillon jusqu'à l'enregistrement.</small></p><label>Importer des sous-titres SRT/VTT existants <input id="subs" type="file" accept=".srt,.vtt,text/plain"></label><button id="import">Importer les paroles horodatées</button><div id="rows"></div><script src="/subtitles/api/editor.js"></script></body></html>
